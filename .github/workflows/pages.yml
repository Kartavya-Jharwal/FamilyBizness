name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install

      - name: Install portfolio dependencies
        working-directory: apps/portfolio
        run: bun install --frozen-lockfile --linker hoisted

      - name: Build
        env:
          GITHUB_PAGES: "1"
          BASE_PATH: /FamilyBizness
        run: bun run build

      - name: Stewardship priority checks
        run: |
          bun run donor:type-check
          bun run --cwd apps/portfolio/apps/frontend test src/adapters/static-demo.test.ts src/features/family-office/stewardship-priorities.test.ts src/features/family-office/please-fix-model.test.ts src/features/family-office/donor-frontend.test.tsx src/components/dither-kit/financial-bands.test.ts src/features/profiles/profile-avatar.test.tsx src/features/profiles/profile-avatar-picker.test.tsx
          node scripts/verify-donor-frontend.mjs --built
          node scripts/verify-dither-kit.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
